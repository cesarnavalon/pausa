<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un minuto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: una sola columna centrada, respiración arriba, reglas abajo; calma, mucho aire */
:root{
  --bg:#E8EEEC; --fg:#1D2B2A; --muted:#5B6E6A; --accent:#3D7A69; --ring:#C9D9D4; --line:#D3DEDA;
  --display:"Young Serif", Georgia, serif;
  --body:"Atkinson Hyperlegible", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111917; --fg:#DCE7E3; --muted:#8FA39E; --accent:#7EC0AD; --ring:#23332F; --line:#24302D; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111917; --fg:#DCE7E3; --muted:#8FA39E; --accent:#7EC0AD; --ring:#23332F; --line:#24302D; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px}
main{max-width:34rem;margin:0 auto;min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;text-align:center}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vw,2.9rem);line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:28rem}
.breath{position:relative;width:min(300px,72vw);aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.breath::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--line)}
.orb{position:absolute;inset:4%;border-radius:50%;background:var(--ring);transform:scale(.62);
  animation:breathe 10s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--accent);opacity:.18}
.cue{position:relative;font-family:var(--display);font-size:1.15rem}
@keyframes breathe{0%{transform:scale(.62)}40%{transform:scale(1)}100%{transform:scale(.62)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none;transform:scale(.85)}}
.rules{list-style:none;margin:0;padding:0;width:100%;text-align:left;border-top:1px solid var(--line)}
.rules li{display:grid;grid-template-columns:2rem 1fr;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.rules li span{font-family:var(--display);color:var(--accent)}
.foot{color:var(--muted);font-size:1rem;margin:0}
</style>
</head>
<body>

<main>
  <div class="time" id="time">—</div>
  <h1>¿Lo has elegido tú, o estás huyendo de algo?</h1>

  <div class="breath" aria-hidden="true"><div class="orb"></div><div class="cue" id="cue">Inspira</div></div>

  <p class="foot">Respira un minuto. Luego vuelve a lo tuyo.</p>
</main>

<script>
(function(){
  var t=document.getElementById('time'), c=document.getElementById('cue');
  function tick(){var d=new Date();t.textContent=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+' · '+d.toLocaleDateString('es-ES',{weekday:'long'});}
  tick(); setInterval(tick,15000);
  var start=Date.now();
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    setInterval(function(){var p=((Date.now()-start)%10000)/10000;c.textContent=p<0.4?'Inspira':'Suelta';},200);
  } else { c.textContent='Respira'; }
})();
</script>
</body>
</html>
